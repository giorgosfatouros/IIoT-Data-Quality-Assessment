[project]
name = "fame-data-quality-backend"
version = "0.2.0"
description = "IIoT Data Quality Assessment Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "SQLAlchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "pydantic>=2.8,<3",
    "orjson==3.10.7",
    "pandas==2.1.4",
    "numpy==1.26.2",
    "scipy==1.11.4",
    "statsmodels==0.14.1",
    "openai>=1.30.0",
    "eval_type_backport>=0.2.2",
    "python-multipart==0.0.20",
    "openai-agents>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
packages = ["api", "core", "models", "schemas"]

