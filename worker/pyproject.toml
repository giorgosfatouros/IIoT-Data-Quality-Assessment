[project]
name = "fame-dqa-worker"
version = "0.1.0"
description = "Data Quality Assessment Worker for IoT Sensor Data"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary==2.9.9",
    "SQLAlchemy==2.0.23",
    "pandas==2.1.4",
    "numpy==1.26.2",
    "scipy==1.11.4",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "python-json-logger==2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
packages = ["worker"]

